<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> My Image Gallery</h1>
    <p> Welcome to my Photo Gallery!</p>
    <div class="Gallery">
        <img src="Nature.jpg" alt="Nature">
        <img src="Dog.jpg" alt="Dog">
        <img src="City.jpg" alt="City">
        <img src="Green Forest.jpg" alt="Green Forest">
        <img src="Beautiful mountains.jpg" alt="Beautiful mountains">
        <img src="Flower.jpg" alt="Flower">
        <img src="sky.jpg" alt="sky">
        <img src="River.jpg" alt=" River">
    </div>
    <div id="lightbox" class="lightbox">
        <button id="close" class="close">&times;</button>
        <button id="prev">previous</button>
        <img id="bigImage" src="" alt="bigImage">
        <button id="next">Next</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
